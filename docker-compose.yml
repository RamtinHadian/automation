services:
  # PostgreSQL Database Server
  postgres_db:
    image: postgres:16-alpine
    container_name: enterprise_automation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-enterprise_automation_db}
      TZ: Asia/Tehran
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-enterprise_automation_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Application server (built from the repo's Dockerfile)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_automation_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The app always talks to the DB over the docker network, regardless of
      # what DB_HOST is set to in .env for local/native runs.
      DB_HOST: postgres_db
      DB_PORT: 5432
    depends_on:
      postgres_db:
        condition: service_healthy
    ports:
      - "${PORT:-8090}:${PORT:-8090}"
    volumes:
      - uploads_data:/app/uploads

  # pgAdmin 4 (optional web GUI for DB management - not started by default).
  # Enable explicitly with: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: enterprise_automation_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@enterprise.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env to use the tools profile}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres_db

volumes:
  postgres_data:
  uploads_data:
