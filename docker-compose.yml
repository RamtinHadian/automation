services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-automation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-automation}
      TZ: Asia/Tehran
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-automation} -d ${DB_NAME:-automation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-automation}:${DB_PASSWORD}@db:5432/${DB_NAME:-automation}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.internal}
      ICE_SERVERS: ${ICE_SERVERS:-}
      AMI_HOST: ${AMI_HOST:-}
      AMI_PORT: ${AMI_PORT:-5038}
      AMI_USER: ${AMI_USER:-}
      AMI_SECRET: ${AMI_SECRET:-}
      VOIP_RECORDING_KEY: ${VOIP_RECORDING_KEY:-}
      DEMO: ${DEMO:-}
      SMSIR_BASE: ${SMSIR_BASE:-}
      TELEGRAM_BASE: ${TELEGRAM_BASE:-}
      BALE_BASE: ${BALE_BASE:-}
      KAVENEGAR_BASE: ${KAVENEGAR_BASE:-}
      DEMO_RESET_HOURS: ${DEMO_RESET_HOURS:-1}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      # every file that is sent is kept here too (the receiver can fetch it even when the sender's computer is off)
      - ${FILES_DIR:-./files}:/files
      # the phone system's recordings folder (read-only), so calls can be played in the call history
      - ${VOIP_RECORDINGS_DIR:-./recordings}:/recordings:ro
      # the host's machine id ties the licence to this server (copying the program elsewhere does not carry it along)
      - ${HOST_MACHINE_ID_FILE:-/etc/machine-id}:/etc/host-machine-id:ro
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-8080}:8080"

  # Full database copies: every night and on request from the admin console. Files land in ./backups on the server.
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-automation}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-automation}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: Asia/Tehran
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/backup-loop.sh"]

volumes:
  pgdata:
