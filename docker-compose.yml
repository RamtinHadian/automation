services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-automation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-automation}
      TZ: Asia/Tehran
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-automation} -d ${DB_NAME:-automation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-automation}:${DB_PASSWORD}@db:5432/${DB_NAME:-automation}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.internal}
      ICE_SERVERS: ${ICE_SERVERS:-}
      AMI_HOST: ${AMI_HOST:-}
      AMI_PORT: ${AMI_PORT:-5038}
      AMI_USER: ${AMI_USER:-}
      AMI_SECRET: ${AMI_SECRET:-}
      DEMO: ${DEMO:-}
      SMSIR_BASE: ${SMSIR_BASE:-}
      KAVENEGAR_BASE: ${KAVENEGAR_BASE:-}
      DEMO_RESET_HOURS: ${DEMO_RESET_HOURS:-6}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  pgdata:
