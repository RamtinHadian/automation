<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: Vazirmatn, Tahoma, 'Segoe UI', sans-serif; }
  body { padding: 8px; }
  .card {
    position: relative; overflow: hidden; background: #fff; border-radius: 18px; border: 1px solid var(--ring);
    box-shadow: 0 10px 30px rgba(58,36,31,.35); cursor: pointer; direction: rtl; text-align: right;
    animation: in 380ms cubic-bezier(.2,.9,.3,1.15) both;
  }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 14px; }
  .icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--soft); color: var(--main); font-size: 20px; }
  .badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--main); margin-bottom: 4px; }
  .title { font-size: 13px; font-weight: 800; color: #3A241F; line-height: 1.6; }
  .body { font-size: 11px; color: #8C6F66; line-height: 1.7; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .x { position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border: 0; background: transparent; color: #8C6F66; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .x:hover { background: #EBDBCE99; }
  .bar { position: absolute; bottom: 0; right: 0; height: 4px; background: var(--main); animation: bar 9s linear both; }
  .paused .bar { animation-play-state: paused; }
  @keyframes in { from { transform: translateY(120%) scale(.96); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes bar { from { width: 100% } to { width: 0 } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="row">
    <div class="icon" id="icon"></div>
    <div style="flex:1;min-width:0">
      <span class="badge" id="badge"></span>
      <div class="title" id="title"></div>
      <div class="body" id="body"></div>
    </div>
  </div>
  <button class="x" id="x" title="بستن">✕</button>
  <div class="bar"></div>
</div>
<script>
  const KINDS = {
    file:   { icon: '📎', main: '#6E1B1B', soft: '#F6D9CD', ring: '#C98B6A80', label: 'فایل' },
    letter: { icon: '✉️', main: '#B45309', soft: '#FEF3C7', ring: '#FCD34D', label: 'نامه' },
    task:   { icon: '📋', main: '#0369A1', soft: '#E0F2FE', ring: '#7DD3FC', label: 'وظیفه' },
    call:   { icon: '📞', main: '#047857', soft: '#D1FAE5', ring: '#6EE7B7', label: 'تماس' },
    alert:  { icon: '⚠️', main: '#BE123C', soft: '#FFE4E6', ring: '#FDA4AF', label: 'هشدار' },
  };
  const fa = (s) => String(s || '').replace(/[0-9]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const card = document.getElementById('card');
  popupApi.onData((n) => {
    const k = KINDS[n.kind] || KINDS.file;
    card.style.setProperty('--main', k.main);
    card.style.setProperty('--soft', k.soft);
    card.style.setProperty('--ring', k.ring);
    document.getElementById('icon').textContent = k.icon;
    document.getElementById('badge').textContent = n.label || k.label;
    document.getElementById('title').textContent = fa(n.title);
    document.getElementById('body').textContent = fa(n.body);
  });
  card.addEventListener('click', () => popupApi.open());
  document.getElementById('x').addEventListener('click', (e) => { e.stopPropagation(); popupApi.close(); });
  card.addEventListener('mouseenter', () => { card.classList.add('paused'); popupApi.hover(true); });
  card.addEventListener('mouseleave', () => { card.classList.remove('paused'); popupApi.hover(false); });
</script>
</body>
</html>
